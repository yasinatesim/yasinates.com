name: Lighthouse Performance Check

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # schedule:
  #   - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # 6 pages × 2 devices × 3 runs takes ~15 min; a hung run used to block the runner for the 6 h default.
    timeout-minutes: 30
    # The action posts the score table as a PR comment; the default read-only token got 403 on that call.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Lighthouse Guard
        uses: yasinatesim/lighthouse-guard@v1
        id: lighthouse
        with:
          urls: |
            [
              {"url": "https://yasinates.com/",          "name": "Home"},
              {"url": "https://yasinates.com/hakkimda",  "name": "Hakkımda"},
              {"url": "https://yasinates.com/projeler",  "name": "Projeler"},
              {"url": "https://yasinates.com/blog",      "name": "Blog"},
              {"url": "https://yasinates.com/github",    "name": "GitHub"},
              {"url": "https://yasinates.com/youtube",   "name": "YouTube"}
            ]

          # 3 measurements → median score (eliminates outliers)
          runs: 3
          strategy: median
          devices: mobile,desktop

          # Thresholds — MFE migration baseline (to be raised after perf optimizations)
          performance-threshold: 35
          accessibility-threshold: 75
          seo-threshold: 90
          best-practices-threshold: 75
          fail-on-threshold: true

          # Ban protection: random jitter added automatically (+0-30%)
          delay-between-runs: 10000
          delay-between-pages: 15000
          max-retries: 3

          # Posts score table as a PR comment (Dependabot PRs always get a read-only token: there it only logs a warning)
          github-token: ${{ github.token }}

          # The action's artifact upload fails on the Node 24 runtime GitHub forces on it
          # ("Cannot set property close of #<Object> which has only a getter"), so it stays off.
          upload-dashboard: false

      - name: Show Results
        if: always()
        run: |
          echo "passed  : ${{ steps.lighthouse.outputs.passed }}"
          echo "summary : ${{ steps.lighthouse.outputs.summary }}"
